name: Reference and documentation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run check:docs
      - run: npm test
      - run: npm run check:palettes
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run check:framework
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reference-test-evidence-${{ matrix.os }}
          path: |
            test-results/
            output/framework/
