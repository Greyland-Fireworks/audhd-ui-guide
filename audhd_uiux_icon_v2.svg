         offset="0"
         stop-color="#ff50b1"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#fff2cb"
         id="stop2" />
    </linearGradient>
    <filter
       id="glow"
       x="0"
       y="0"
       width="1024"
       height="1024"
       filterUnits="userSpaceOnUse"
       color-interpolation-filters="sRGB">
      <feGaussianBlur
         in="SourceGraphic"
         stdDeviation="5"
         result="blur"
         id="feGaussianBlur2" />
      <feComponentTransfer
         in="blur"
         result="soft-glow"
         id="feComponentTransfer2">
        <feFuncA
           type="linear"
           slope="0.45"
           id="feFuncA2" />
      </feComponentTransfer>
      <feMerge
         id="feMerge3">
        <feMergeNode
           in="soft-glow"
           id="feMergeNode2" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode3" />
      </feMerge>
    </filter>
