  <title
     id="logo-title">AuDHD UI/UX</title>
  <desc
     id="logo-description">AuDHD curves across the top and UI/UX across the bottom of a turquoise circular frame. The overlapping circuit brains and central spark merge into one continuous pink-to-cream color wash.</desc>
  <!-- Editable vector master, 1024-unit square; center 512,512.
       Letter centers follow radius 396, rotated tangent to the circle.
       Glyphs use an 80-unit cap height and 18-unit spacing along the arc.
       Text is outlined for consistent rendering without installed fonts.
       Each letter is an editable use of a named glyph in defs.
       All brain geometry lives in #brain-shape and is painted ONCE by
       #brain-symbol. Edit #brain-wash for a continuous shared color wash.
       Remove the filter on #emblem to disable the optional soft glow. -->
  <defs
     id="defs4">
