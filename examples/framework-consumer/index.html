<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isolated framework consumer</title>
<link rel="icon" href="data:,">
<section id="settings" class="ui-skin" data-skin="paperwhite" data-type="serif">
  <h1>Local preference preview</h1>
  <p>Preferences apply to this session only. Unsupported choices remain in exports. No document data is exported.</p>
  <label>Unsaved note <textarea id="draft"></textarea></label>
  <label>Import preferences <input id="import" type="file" accept=".json,application/json"></label>
  <div id="preview" hidden><h2>Requested choices</h2><ul id="choices"></ul>
    <button id="apply" type="button">Apply for this session</button>
  </div>
  <button id="cancel" type="button" hidden>Cancel import</button>
  <button id="export" type="button">Export preferences</button>
  <p id="status" role="status"></p><p id="error" role="alert"></p>
</section>
<aside id="neighbor" data-skin="obsidian" data-type="mono"><p class="ui-muted">Unmarked neighboring content</p><button class="ui-action">Neighbor action</button></aside>
<script type="module" src="/main.js"></script>
</html>
